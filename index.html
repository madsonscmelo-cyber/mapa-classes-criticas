<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classes Críticas — Prioridade A por UTD</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
 html,body{margin:0;padding:0;height:100%;font-family:system-ui,Segoe UI,Arial}
 #map{height:100%}
 .painel{position:absolute;top:12px;right:12px;z-index:1000;background:#fff;border-radius:10px;
   box-shadow:0 2px 10px rgba(0,0,0,.25);padding:12px 14px;font-size:13px;max-width:280px}
 .painel h1{font-size:15px;margin:0 0 6px}
 .painel .l{display:flex;align-items:center;gap:6px;margin:3px 0}
 .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
 .sub{color:#556;font-size:11.5px;margin-top:6px}
 .lg-leg{display:flex;gap:4px;align-items:center;margin:2px 0}
 .circ{border-radius:50%;background:#e11d48aa;border:1.5px solid #e11d48;display:inline-block}
</style></head>
<body>
<div id="map"></div>
<div class="painel">
 <h1>Classes Críticas — Prio A</h1>
 <div class="l"><span class="dot" style="background:#e11d48"></span> Jacobina · 4.226 A</div>
 <div class="l"><span class="dot" style="background:#f59e0b"></span> S. Bonfim · 3.600 A</div>
 <div class="l"><span class="dot" style="background:#2563eb"></span> Juazeiro · 3.445 A</div>
 <div class="l"><span class="dot" style="background:#059669"></span> Remanso · 1.321 A</div>
 <div class="lg-leg"><span class="circ" style="width:10px;height:10px"></span><small>bolha = prio A no município</small></div>
 <div class="lg-leg"><span class="dot" style="background:#333;width:9px;height:9px"></span><small>pontos = amostra 200 geocodificada</small></div>
 <div class="sub">Receita Federal 2026-09 · 43 municípios · 25.625 alvos (12.592 A)</div>
</div>

</script>
</body></html>
